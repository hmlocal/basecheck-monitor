name: BaseCheck Monitor

on:
  schedule:
    # Déclenchement toutes les 30 minutes (relais automatique et chien de garde)
    - cron: "0,30 * * * *"
  workflow_dispatch:   # Permet de lancer manuellement depuis GitHub si besoin

# Évite les exécutions en double : un seul runner actif à la fois
concurrency:
  group: basecheck-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Surveillance continue et chien de garde
        run: python check.py
        env:
          NTRIP_HOST:       ${{ secrets.NTRIP_HOST }}
          NTRIP_PORT:       ${{ secrets.NTRIP_PORT }}
          NTRIP_MOUNTPOINT: ${{ secrets.NTRIP_MOUNTPOINT }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
