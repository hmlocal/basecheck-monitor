name: BaseCheck Monitor

on:
  schedule:
    # Toutes les 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:   # Permet de lancer manuellement depuis GitHub si besoin

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier la base NTRIP et enregistrer dans Supabase
        run: python check.py
        env:
          NTRIP_HOST:       ${{ secrets.NTRIP_HOST }}
          NTRIP_PORT:       ${{ secrets.NTRIP_PORT }}
          NTRIP_MOUNTPOINT: ${{ secrets.NTRIP_MOUNTPOINT }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
