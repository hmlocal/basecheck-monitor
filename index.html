<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attachement automatique — Connexion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }

    /* ══ LOCK SCREEN ══ */
    #lockScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .lock-card {
      background: #1a1f2e;
      border: 1px solid #2a2e3d;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .lock-icon { font-size: 2.4rem; margin-bottom: 16px; }
    .lock-card h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    .lock-card p { color: #64748b; font-size: 0.84rem; margin-bottom: 24px; }
    .lock-input {
      width: 100%; background: #0f1117; border: 1px solid #2a2e3d;
      border-radius: 10px; color: #e2e8f0; font-size: 0.95rem;
      padding: 12px 14px; margin-bottom: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .lock-input:focus { border-color: #3b82f6; }
    .lock-input.error { border-color: #ef4444; }
    .lock-btn {
      width: 100%; background: #3b82f6; color: #fff; border: none;
      border-radius: 10px; font-size: 1rem; font-weight: 600;
      padding: 12px; cursor: pointer; transition: background 0.2s;
    }
    .lock-btn:hover { background: #2563eb; }
    .lock-error { color: #ef4444; font-size: 0.8rem; margin-top: 10px; min-height: 18px; }
    .lock-remember {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 0.78rem; color: #64748b; margin-bottom: 14px;
    }

    /* ══ DASHBOARD ══ */
    #dashboard { display: none; }

    header {
      text-align: center; margin-bottom: 28px; position: relative;
    }
    header h1 { font-size: 1.7rem; font-weight: 700; }
    header .subtitle { color: #64748b; font-size: 0.82rem; margin-top: 4px; }
    .dot-header {
      display: inline-block; width: 13px; height: 13px;
      border-radius: 50%; vertical-align: middle; margin-right: 7px; background: #64748b;
    }
    .header-actions {
      position: absolute; top: 0; right: 0;
      display: flex; gap: 8px;
    }
    .logout-btn {
      background: none; border: 1px solid #2a2e3d; border-radius: 8px;
      color: #94a3b8; font-size: 0.76rem; padding: 6px 11px;
      cursor: pointer; transition: all 0.2s;
    }
    .logout-btn:hover { border-color: #475569; color: #fff; }

    /* ── Statut actuel ── */
    .current-status {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; background: #1a1f2e; border: 1px solid #2a2e3d;
      border-radius: 14px; padding: 18px 24px;
      max-width: 500px; margin: 0 auto 24px;
    }
    .status-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.green  { background: #22c55e; box-shadow: 0 0 10px #22c55e88; }
    .status-dot.red    { background: #ef4444; box-shadow: 0 0 10px #ef444488; }
    .status-dot.orange { background: #f97316; box-shadow: 0 0 10px #f9731688; }
    .status-dot.gray   { background: #475569; }
    .status-label { font-size: 1.05rem; font-weight: 600; }
    .status-time  { font-size: 0.76rem; color: #64748b; margin-top: 2px; }

    .status-btn-group {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    }
    .action-btn {
      background: #0f1117; border: 1px solid #2a2e3d; border-radius: 8px;
      color: #94a3b8; font-size: 0.82rem; padding: 7px 11px;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .action-btn:hover {
      background: #1e2538; color: #fff; border-color: #3b82f6;
    }
    .action-btn.primary {
      background: #1e3a8a; border-color: #3b82f6; color: #bfdbfe; font-weight: 600;
    }
    .action-btn.primary:hover {
      background: #2563eb; color: #fff;
    }
    .action-btn:disabled {
      opacity: 0.6; cursor: not-allowed;
    }

    .section-title {
      font-size: 0.85rem; font-weight: 600; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 1px;
      margin: 0 auto 10px; max-width: 700px;
    }

    /* ══ CALENDRIER 3 MOIS ══ */
    .calendar-grid {
      max-width: 700px; margin: 0 auto 32px;
      display: flex; flex-direction: column; gap: 18px;
    }

    .month-block {
      background: #1a1f2e; border: 1px solid #2a2e3d;
      border-radius: 12px; overflow: hidden;
    }
    .month-header {
      background: #131720; padding: 10px 16px;
      border-bottom: 1px solid #2a2e3d;
      font-size: 0.9rem; font-weight: 700;
      color: #cbd5e1; letter-spacing: 0.5px;
      text-transform: capitalize;
      display: flex; justify-content: space-between; align-items: center;
    }
    .export-btn {
      background: #0f1117; border: 1px solid #2a2e3d; border-radius: 6px;
      color: #94a3b8; font-size: 0.72rem; font-weight: 500;
      padding: 4px 10px; cursor: pointer; display: inline-flex;
      align-items: center; gap: 5px; transition: all 0.2s;
    }
    .export-btn:hover {
      background: #1e2538; color: #fff; border-color: #3b82f6;
    }

    .month-table { width: 100%; border-collapse: collapse; }
    .month-table thead th {
      padding: 7px 10px; text-align: left;
      font-size: 0.68rem; color: #475569;
      text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid #1e2536;
      background: #131720;
    }
    .month-table tbody tr.day-row {
      border-bottom: 1px solid #1a2030;
      transition: background 0.15s;
      cursor: pointer;
      user-select: none;
    }
    .month-table tbody tr.day-row:hover {
      background: #20273a !important;
    }
    .month-table tbody tr.day-row.expanded {
      background: #192033 !important;
    }
    .month-table tbody td {
      padding: 8px 10px; font-size: 0.82rem; vertical-align: middle;
    }

    .day-chevron {
      display: inline-block; font-size: 0.62rem; color: #64748b;
      margin-right: 6px; transition: transform 0.2s; vertical-align: middle;
    }
    .day-row.expanded .day-chevron {
      transform: rotate(90deg); color: #60a5fa;
    }

    /* Ligne de détail déroulante (accordéon) */
    .detail-row {
      display: none; background: #111522;
    }
    .detail-row.open {
      display: table-row;
    }
    .detail-container {
      padding: 12px 16px 14px 28px;
      border-left: 3px solid #3b82f6;
    }
    .detail-header-info {
      font-size: 0.75rem; color: #94a3b8;
      margin-bottom: 8px; font-weight: 600;
    }
    .detail-table {
      width: 100%; max-width: 420px; border-collapse: collapse;
      background: #161b29; border: 1px solid #242b3e;
      border-radius: 6px; overflow: hidden;
    }
    .detail-table th {
      background: #0f131f; padding: 6px 10px; font-size: 0.68rem;
      color: #64748b; text-transform: uppercase; text-align: left;
      border-bottom: 1px solid #242b3e;
    }
    .detail-table td {
      padding: 6px 10px; font-size: 0.78rem;
      border-bottom: 1px solid #1a2030; color: #cbd5e1;
    }
    .detail-table tr:last-child td {
      border-bottom: none;
    }

    .td-date {
      font-weight: 600; color: #94a3b8;
      white-space: nowrap; width: 120px;
    }
    .td-date.today { color: #60a5fa; }
    .td-date.weekend { color: #7c8da8; }

    .day-dot {
      display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; margin-right: 7px; flex-shrink: 0;
      vertical-align: middle;
    }
    .day-dot.green  { background: #22c55e; }
    .day-dot.red    { background: #ef4444; }
    .day-dot.gray   { background: #334155; }

    .td-times { color: #cbd5e1; font-size: 0.8rem; }
    .td-times .time-on  { color: #4ade80; }
    .td-times .time-off { color: #f87171; }
    .td-times .no-data { color: #334155; font-style: italic; }

    footer {
      text-align: center; color: #334155;
      font-size: 0.72rem; margin-top: 12px;
    }

    @media (max-width: 500px) {
      header h1 { font-size: 1.3rem; }
      .header-actions { position: static; justify-content: center; margin-top: 10px; }
      .detail-table { max-width: 100%; }
    }
  </style>
</head>
<body>

<!-- ══ LOCK SCREEN ══ -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2>Attachement automatique</h2>
    <p>Entrez le mot de passe pour accéder au tableau de bord.</p>
    <input type="password" id="pwdInput" class="lock-input"
           placeholder="Mot de passe" autocomplete="current-password" />
    <label class="lock-remember">
      <input type="checkbox" id="rememberCheck" checked />
      Se souvenir sur cet appareil
    </label>
    <button class="lock-btn" onclick="tryUnlock()">Accéder</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<!-- ══ DASHBOARD ══ -->
<div id="dashboard">
  <header>
    <h1><span class="dot-header" id="headerDot"></span>Attachement automatique</h1>
    <p class="subtitle">Surveillance (15min / 30min)</p>
    <div class="header-actions">
      <button class="logout-btn" onclick="logout()">🔒 Verrouiller</button>
    </div>
  </header>

  <!-- Statut actuel -->
  <div class="current-status">
    <div class="status-dot gray" id="currentDot"></div>
    <div style="flex: 1;">
      <div class="status-label" id="currentLabel">Chargement…</div>
      <div class="status-time"  id="currentTime"></div>
    </div>
    <div class="status-btn-group">
      <button class="action-btn" onclick="loadAndRender()" title="Rafraîchir les données enregistrées">🔄 Actualiser</button>
      <button class="action-btn primary" id="btnTestNow" onclick="triggerImmediateCheck()" title="Lancer une vérification physique maintenant via le robot GitHub">⚡ Tester maintenant</button>
    </div>
  </div>

  <!-- Calendrier 3 mois -->
  <div class="section-title">Calendrier — 3 derniers mois</div>
  <div class="calendar-grid" id="calendarGrid">
    <div style="text-align:center;color:#475569;padding:32px">Chargement…</div>
  </div>

  <footer id="footer">—</footer>
</div>

<script>
// ══════════════════════════════════════════
//  MOT DE PASSE (SHA-256 Web Crypto)
//  Par défaut : BaseCheck2024
// ══════════════════════════════════════════
const UNLOCK_KEY = "basecheck_unlocked_v1";
let resolvedHash = null;

async function sha256(msg) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
async function initHash() {
  resolvedHash = await sha256("BaseCheck2024");
}
async function tryUnlock() {
  const val = document.getElementById("pwdInput").value;
  const err = document.getElementById("lockError");
  const inp = document.getElementById("pwdInput");
  if (!val) { err.textContent = "Mot de passe requis."; inp.classList.add("error"); return; }
  if (await sha256(val) === resolvedHash) {
    inp.classList.remove("error"); err.textContent = "";
    const rem = document.getElementById("rememberCheck").checked;
    (rem ? localStorage : sessionStorage).setItem(UNLOCK_KEY, resolvedHash);
    showDashboard();
  } else {
    err.textContent = "Mot de passe incorrect.";
    inp.classList.add("error"); inp.value = ""; inp.focus();
  }
}
function logout() {
  localStorage.removeItem(UNLOCK_KEY); sessionStorage.removeItem(UNLOCK_KEY);
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("lockScreen").style.display = "flex";
  document.getElementById("pwdInput").value = "";
}
function showDashboard() {
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  document.title = "Attachement automatique";
  loadAndRender();
}
async function checkAutoUnlock() {
  await initHash();
  const stored = localStorage.getItem(UNLOCK_KEY) || sessionStorage.getItem(UNLOCK_KEY);
  if (stored === resolvedHash) showDashboard();
}
document.getElementById("pwdInput").addEventListener("keydown", e => { if (e.key==="Enter") tryUnlock(); });



// ══════════════════════════════════════════
//  HELPERS & RENDU
// ══════════════════════════════════════════
const LABEL = { ONLINE:"en ligne", BASE_OFFLINE:"hors-ligne", NO_INTERNET:"pas d'accès internet" };
const COLOR = { ONLINE:"green", BASE_OFFLINE:"red", NO_INTERNET:"orange" };

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
}
function fmtTimeFull(iso) {
  return new Date(iso).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
}
function localDayKey(iso) {
  const d = new Date(iso);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function analyze(entries) {
  const last = entries[entries.length - 1];
  const now = new Date();

  const dayMap = {};
  for (const e of entries) {
    const k = localDayKey(e.timestamp);
    if (!dayMap[k]) dayMap[k] = [];
    dayMap[k].push(e);
  }

  // 3 derniers mois
  const months = [];
  for (let i = 0; i < 3; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ year: d.getFullYear(), month: d.getMonth() });
  }

  const calData = months.map(({ year, month }) => {
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const days = [];

    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(year, month, d);
      if (date > now) continue;

      const key = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
      const es = dayMap[key] || [];

      const uptime = es.length
        ? Math.round(100 * es.filter(e => e.status === "ONLINE").length / es.length)
        : null;

      const hasOnline = es.some(e => e.status === "ONLINE");
      const onlineEntries = es.filter(e => e.status === "ONLINE");
      const firstOn = onlineEntries.length ? onlineEntries[0].timestamp : null;

      let lastOff = null;
      if (onlineEntries.length) {
        const lastOnIdx = es.lastIndexOf(onlineEntries[onlineEntries.length - 1]);
        for (let i = lastOnIdx + 1; i < es.length; i++) {
          if (es[i].status !== "ONLINE") { lastOff = es[i].timestamp; break; }
        }
      }

      const isToday = key === localDayKey(now.toISOString());
      const dow = date.getDay();
      const isWeekend = dow === 0 || dow === 6;

      days.push({ date, key, day: d, es, uptime, hasOnline, firstOn, lastOff, isToday, isWeekend });
    }

    days.reverse();
    const monthName = new Date(year, month, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    return { year, month, monthName, days };
  });

  return { last, calData };
}

function render(data) {
  const { last, calData } = data;

  const col = COLOR[last.status] || "gray";
  document.getElementById("currentDot").className = "status-dot " + col;
  const hd = document.getElementById("headerDot");
  hd.style.background = col==="green"?"#22c55e":col==="red"?"#ef4444":col==="orange"?"#f97316":"#475569";
  document.getElementById("currentLabel").textContent = LABEL[last.status] || last.status;
  document.getElementById("currentTime").textContent  =
    "Dernière vérification : " + new Date(last.timestamp).toLocaleString("fr-FR");

  const grid = document.getElementById("calendarGrid");
  grid.innerHTML = "";

  for (const mon of calData) {
    const block = document.createElement("div");
    block.className = "month-block";

    const hdr = document.createElement("div");
    hdr.className = "month-header";

    const titleSpan = document.createElement("span");
    titleSpan.textContent = mon.monthName.charAt(0).toUpperCase() + mon.monthName.slice(1);
    hdr.appendChild(titleSpan);

    if (mon.days.length > 0) {
      const exportBtn = document.createElement("button");
      exportBtn.className = "export-btn";
      exportBtn.innerHTML = "📥 Exporter CSV";
      exportBtn.title = "Télécharger le résumé du mois en format CSV";
      exportBtn.onclick = (e) => {
        e.stopPropagation();
        exportMonthCSV(mon);
      };
      hdr.appendChild(exportBtn);
    }

    block.appendChild(hdr);

    if (!mon.days.length) {
      const empty = document.createElement("div");
      empty.style.cssText = "padding:16px;color:#475569;font-size:0.82rem;text-align:center";
      empty.textContent = "Aucune donnée pour ce mois";
      block.appendChild(empty);
      grid.appendChild(block);
      continue;
    }

    const tbl = document.createElement("table");
    tbl.className = "month-table";
    tbl.innerHTML = `<thead><tr>
      <th>Jour</th>
      <th>Statut</th>
      <th>Premier allumage</th>
      <th>Dernier arrêt</th>
    </tr></thead>`;

    const tbody = document.createElement("tbody");

    for (const day of mon.days) {
      const tr = document.createElement("tr");
      tr.className = "day-row";
      tr.dataset.key = day.key;
      tr.title = "Cliquez pour voir le détail des vérifications de cette journée";

      const dateLabel = day.date.toLocaleDateString("fr-FR", { weekday:"short", day:"2-digit" });
      const tdDate = document.createElement("td");
      tdDate.className = "td-date" + (day.isToday ? " today" : day.isWeekend ? " weekend" : "");
      tdDate.innerHTML = `<span class="day-chevron">▶</span>${dateLabel}${day.isToday ? " ★" : ""}`;
      tr.appendChild(tdDate);

      const tdStatus = document.createElement("td");
      if (!day.es.length) {
        tdStatus.innerHTML = '<span class="day-dot gray"></span><span style="color:#334155;font-size:0.76rem">—</span>';
      } else if (day.hasOnline) {
        tdStatus.innerHTML = '<span class="day-dot green"></span><span style="color:#4ade80;font-size:0.76rem">En ligne</span>';
      } else {
        tdStatus.innerHTML = '<span class="day-dot red"></span><span style="color:#f87171;font-size:0.76rem">Hors-ligne</span>';
      }
      tr.appendChild(tdStatus);

      const tdOn = document.createElement("td");
      tdOn.className = "td-times";
      tdOn.innerHTML = day.firstOn ? `<span class="time-on">▲ ${fmtTime(day.firstOn)}</span>` : `<span class="no-data">—</span>`;
      tr.appendChild(tdOn);

      const tdOff = document.createElement("td");
      tdOff.className = "td-times";
      if (day.lastOff) {
        tdOff.innerHTML = `<span class="time-off">▼ ${fmtTime(day.lastOff)}</span>`;
      } else if (day.hasOnline && !day.lastOff) {
        tdOff.innerHTML = `<span style="color:#64748b;font-size:0.76rem">${day.isToday ? "En cours" : "Toute la journée"}</span>`;
      } else {
        tdOff.innerHTML = `<span class="no-data">—</span>`;
      }
      tr.appendChild(tdOff);

      tbody.appendChild(tr);

      // Ligne de détail déroulante (accordéon)
      const trDetail = document.createElement("tr");
      trDetail.className = "detail-row";
      trDetail.id = "detail-" + day.key;

      const tdDetail = document.createElement("td");
      tdDetail.colSpan = 4;

      const fullDateStr = day.date.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
      let detailContent = `
        <div class="detail-container">
          <div class="detail-header-info">
            📋 Vérifications du ${fullDateStr} (${day.es.length} test${day.es.length > 1 ? "s" : ""})
          </div>`;

      if (day.es.length === 0) {
        detailContent += `<div style="color:#64748b;font-size:0.78rem;font-style:italic;padding:4px 0;">Aucune vérification enregistrée pour cette journée.</div>`;
      } else {
        detailContent += `
          <table class="detail-table">
            <thead>
              <tr>
                <th>Heure (GMT+1)</th>
                <th>Statut</th>
              </tr>
            </thead>
            <tbody>`;

        for (const e of day.es) {
          const timeStr = fmtTimeFull(e.timestamp);
          const st = e.status;
          const dotClass = st === "ONLINE" ? "green" : st === "BASE_OFFLINE" ? "red" : st === "NO_INTERNET" ? "orange" : "gray";
          const stLabel = st === "ONLINE" ? "En ligne" : st === "BASE_OFFLINE" ? "Hors-ligne" : st === "NO_INTERNET" ? "Pas d'accès internet" : st;
          const stColor = st === "ONLINE" ? "#4ade80" : st === "BASE_OFFLINE" ? "#f87171" : "#fb923c";

          detailContent += `
              <tr>
                <td style="font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0.3px;">${timeStr}</td>
                <td><span class="day-dot ${dotClass}"></span><span style="color:${stColor};font-size:0.76rem;">${stLabel}</span></td>
              </tr>`;
        }

        detailContent += `
            </tbody>
          </table>`;
      }

      detailContent += `</div>`;
      tdDetail.innerHTML = detailContent;
      trDetail.appendChild(tdDetail);
      tbody.appendChild(trDetail);

      // Clic pour dérouler / replier (si on ouvre l'un, l'autre se ferme)
      tr.addEventListener("click", () => toggleDayDetail(day.key));
    }

    tbl.appendChild(tbody);
    block.appendChild(tbl);
    grid.appendChild(block);
  }

  document.getElementById("footer").textContent =
    "Attachement automatique · Données privées Supabase · Rafraîchi le " + new Date().toLocaleString("fr-FR");
}

// ══════════════════════════════════════════
//  ACCORDÉON : DÉTAIL D'UNE JOURNÉE
//  Règle : un seul jour ouvert à la fois
// ══════════════════════════════════════════
function toggleDayDetail(key) {
  const detailRow = document.getElementById("detail-" + key);
  const dayRow = document.querySelector(`.day-row[data-key="${key}"]`);
  if (!detailRow || !dayRow) return;

  const isCurrentlyOpen = detailRow.classList.contains("open");

  // Fermer TOUS les détails ouverts ("si on ouvre un l'autre ferme")
  document.querySelectorAll(".detail-row.open").forEach(el => el.classList.remove("open"));
  document.querySelectorAll(".day-row.expanded").forEach(el => el.classList.remove("expanded"));

  // Si la ligne n'était pas ouverte, on l'ouvre
  if (!isCurrentlyOpen) {
    detailRow.classList.add("open");
    dayRow.classList.add("expanded");
  }
}

// ══════════════════════════════════════════
//  EXPORT CSV D'UN MOIS
// ══════════════════════════════════════════
function exportMonthCSV(mon) {
  if (!mon || !mon.days || !mon.days.length) {
    alert("Aucune donnée disponible pour ce mois.");
    return;
  }

  // En-têtes CSV
  const headers = ["Jour", "Date", "Statut", "Premier allumage", "Dernier arret"];
  const rows = [headers];

  // Tri chronologique du 1er au dernier jour du mois
  const sortedDays = [...mon.days].sort((a, b) => a.date - b.date);

  for (const day of sortedDays) {
    const dayName = day.date.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit" });
    const dateStr = day.key;
    let statusText = "Aucune donnee";
    if (day.es.length > 0) {
      statusText = day.hasOnline ? "En ligne" : "Hors-ligne";
    }
    const firstOn = day.firstOn ? fmtTime(day.firstOn) : "—";
    let lastOff = "—";
    if (day.lastOff) {
      lastOff = fmtTime(day.lastOff);
    } else if (day.hasOnline && !day.lastOff) {
      lastOff = day.isToday ? "En cours" : "Toute la journee";
    }

    rows.push([
      `"${dayName}"`,
      `"${dateStr}"`,
      `"${statusText}"`,
      `"${firstOn}"`,
      `"${lastOff}"`
    ]);
  }

  // Encodage UTF-8 avec BOM pour compatibilité parfaite avec Excel
  const csvContent = "\uFEFF" + rows.map(r => r.join(";")).join("\r\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const cleanName = mon.monthName.replace(/[^a-zA-Z0-9]/g, "_");
  a.href = url;
  a.download = `attachement_${cleanName}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ══════════════════════════════════════════
//  CHARGEMENT DEPUIS SUPABASE
// ══════════════════════════════════════════
async function loadAndRender() {
  const sbUrl = "https://swrspopzrvlqeqgjrjnk.supabase.co";
  const sbKey = "sb_publishable_TYARdL7zrPN7fUqz1Wm1Zg_i0cBWjv1";

  try {
    let allRaw = [];
    let offset = 0;
    const batchSize = 1000;
    const maxEntries = 6000; // Couvre largement les 3 mois d'historique

    // Supabase limite chaque requête à 1000 lignes max (max-rows).
    // On pagine avec offset pour récupérer l'intégralité des données sans coupure.
    while (allRaw.length < maxEntries) {
      const url = `${sbUrl.replace(/\/+$/, "")}/rest/v1/base_checks?select=status,created_at&order=created_at.desc&limit=${batchSize}&offset=${offset}`;
      const resp = await fetch(url, {
        headers: {
          "apikey": sbKey,
          "Authorization": `Bearer ${sbKey}`
        }
      });
      if (!resp.ok) throw new Error("Erreur HTTP Supabase (" + resp.status + ")");
      const raw = await resp.json();
      if (!raw || raw.length === 0) break;
      allRaw = allRaw.concat(raw);
      if (raw.length < batchSize) break; // Fin des données atteinte
      offset += batchSize;
    }

    const entries = allRaw.map(e => ({ status: e.status, timestamp: e.created_at })).reverse();
    if (!entries.length) {
      document.getElementById("currentLabel").textContent = "Aucune donnée";
      document.getElementById("calendarGrid").innerHTML =
        '<div style="text-align:center;color:#475569;padding:32px">Aucun enregistrement trouvé dans la table Supabase.</div>';
      return;
    }
    render(analyze(entries));
  } catch (e) {
    document.getElementById("currentLabel").textContent = "Erreur Supabase";
    document.getElementById("currentTime").textContent  = e.message;
    console.error(e);
  }
}

// ══════════════════════════════════════════
//  TEST EN DIRECT VIA GITHUB ACTIONS
// ══════════════════════════════════════════
async function triggerImmediateCheck() {
  let token = localStorage.getItem("basecheck_gh_token");
  if (!token) {
    token = prompt("Pour lancer un test physique immédiat, collez votre jeton GitHub (enregistré uniquement sur votre appareil) :");
    if (!token) return;
    token = token.trim();
    localStorage.setItem("basecheck_gh_token", token);
  }

  const btn = document.getElementById("btnTestNow");
  btn.disabled = true;
  btn.innerHTML = "⏳ Lancement...";

  try {
    const url = "https://api.github.com/repos/hmlocal/basecheck-monitor/actions/workflows/monitor.yml/dispatches";
    const resp = await fetch(url, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ ref: "main" })
    });

    if (resp.status === 401 || resp.status === 403) {
      localStorage.removeItem("basecheck_gh_token");
      alert("Jeton GitHub invalide ou permissions insuffisantes. Veuillez réessayer.");
      btn.disabled = false;
      btn.innerHTML = "⚡ Tester maintenant";
      return;
    }

    if (!resp.ok && resp.status !== 204) {
      throw new Error("Erreur GitHub (Code " + resp.status + ")");
    }

    btn.innerHTML = "⏳ Test en cours (~20s)...";
    const startTime = Date.now();

    // ID le plus élevé actuel
    let maxId = 0;
    try {
      const r = await fetch("https://swrspopzrvlqeqgjrjnk.supabase.co/rest/v1/base_checks?select=id&order=id.desc&limit=1", {
        headers: { "apikey": "sb_publishable_TYARdL7zrPN7fUqz1Wm1Zg_i0cBWjv1" }
      });
      const d = await r.json();
      if (d.length) maxId = d[0].id;
    } catch(e) {}

    // Vérifier l'arrivée du résultat toutes les 3 secondes
    const interval = setInterval(async () => {
      try {
        const r = await fetch("https://swrspopzrvlqeqgjrjnk.supabase.co/rest/v1/base_checks?select=id&order=id.desc&limit=1", {
          headers: { "apikey": "sb_publishable_TYARdL7zrPN7fUqz1Wm1Zg_i0cBWjv1" }
        });
        const d = await r.json();
        if (d.length && d[0].id > maxId) {
          clearInterval(interval);
          btn.innerHTML = "✅ Résultat reçu !";
          await loadAndRender();
          setTimeout(() => {
            btn.disabled = false;
            btn.innerHTML = "⚡ Tester maintenant";
          }, 3000);
          return;
        }
      } catch(e) {}

      // Timeout après 45s
      if (Date.now() - startTime > 45000) {
        clearInterval(interval);
        btn.disabled = false;
        btn.innerHTML = "⚡ Tester maintenant";
        loadAndRender();
      }
    }, 3000);

  } catch(e) {
    alert("Impossible de lancer le test : " + e.message);
    btn.disabled = false;
    btn.innerHTML = "⚡ Tester maintenant";
  }
}
